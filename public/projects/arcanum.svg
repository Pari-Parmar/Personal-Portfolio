<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15082a" />
      <stop offset="50%" stop-color="#240046" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)" />

  <!-- Particle / Waveform Audio Spectrum -->
  <g opacity="0.3">
    <circle cx="400" cy="225" r="160" fill="none" stroke="#7209b7" stroke-width="1" stroke-dasharray="4,8" />
    <circle cx="400" cy="225" r="110" fill="none" stroke="#f72585" stroke-width="1.5" />
  </g>

  <!-- Audio Wave Bars in Center -->
  <g transform="translate(180, 225)">
    <!-- Symmetric audio bars -->
    <rect x="0" y="-20" width="8" height="40" rx="4" fill="#f72585" />
    <rect x="18" y="-35" width="8" height="70" rx="4" fill="#f72585" />
    <rect x="36" y="-55" width="8" height="110" rx="4" fill="#b5179e" />
    <rect x="54" y="-80" width="8" height="160" rx="4" fill="#7209b7" />
    <rect x="72" y="-45" width="8" height="90" rx="4" fill="#7209b7" />
    <rect x="90" y="-70" width="8" height="140" rx="4" fill="#560bad" />
    <rect x="108" y="-95" width="8" height="190" rx="4" fill="#480ca8" />
    <rect x="126" y="-60" width="8" height="120" rx="4" fill="#3f37c9" />
    <rect x="144" y="-85" width="8" height="170" rx="4" fill="#4361ee" />
    <rect x="162" y="-100" width="8" height="200" rx="4" fill="#4895ef" />
    <rect x="180" y="-75" width="8" height="150" rx="4" fill="#4cc9f0" />
    <rect x="198" y="-50" width="8" height="100" rx="4" fill="#4cc9f0" />
    <rect x="216" y="-90" width="8" height="180" rx="4" fill="#4895ef" />
    <rect x="234" y="-65" width="8" height="130" rx="4" fill="#4361ee" />
    <rect x="252" y="-40" width="8" height="80" rx="4" fill="#3f37c9" />
    <rect x="270" y="-75" width="8" height="150" rx="4" fill="#560bad" />
    <rect x="288" y="-90" width="8" height="180" rx="4" fill="#7209b7" />
    <rect x="306" y="-50" width="8" height="100" rx="4" fill="#7209b7" />
    <rect x="324" y="-70" width="8" height="140" rx="4" fill="#b5179e" />
    <rect x="342" y="-35" width="8" height="70" rx="4" fill="#f72585" />
    <rect x="360" y="-20" width="8" height="40" rx="4" fill="#f72585" />
  </g>

  <!-- Floating UI Overlay -->
  <rect x="230" y="55" width="340" height="90" rx="16" fill="#10002b" fill-opacity="0.9" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="400" y="95" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Arcanum AI</text>
  <text x="400" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#f72585" text-anchor="middle">Real-Time Classroom Translation & Semantic Engine</text>

  <!-- Tags -->
  <rect x="120" y="360" width="160" height="34" rx="8" fill="#10002b" stroke="#f72585" stroke-opacity="0.5" />
  <text x="200" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f3f4f6" text-anchor="middle">Whisper Speech AI</text>

  <rect x="310" y="360" width="180" height="34" rx="8" fill="#10002b" stroke="#7209b7" stroke-opacity="0.5" />
  <text x="400" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f3f4f6" text-anchor="middle">WebSocket Low-Latency</text>

  <rect x="520" y="360" width="160" height="34" rx="8" fill="#10002b" stroke="#4cc9f0" stroke-opacity="0.5" />
  <text x="600" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f3f4f6" text-anchor="middle">Multilingual Glossary</text>
</svg>
