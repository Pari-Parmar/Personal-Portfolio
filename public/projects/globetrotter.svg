<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="60%" stop-color="#121d3b" />
      <stop offset="100%" stop-color="#1c3166" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg1)" />
  
  <!-- Grid -->
  <g opacity="0.12">
    <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360" stroke="#60a5fa" stroke-width="1" />
    <path d="M 160,0 L 160,450 M 320,0 L 320,450 M 480,0 L 480,450 M 640,0 L 640,450" stroke="#60a5fa" stroke-width="1" />
  </g>

  <!-- Globe Rings -->
  <circle cx="400" cy="225" r="140" fill="none" stroke="#3a86ff" stroke-width="1.5" opacity="0.25" />
  <ellipse cx="400" cy="225" rx="140" ry="50" fill="none" stroke="#00f5d4" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="400" cy="225" rx="60" ry="140" fill="none" stroke="#7b2cbf" stroke-width="1.5" opacity="0.3" />

  <!-- Flight Path Curve -->
  <path d="M 180,310 C 260,110 520,110 620,290" fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Waypoints -->
  <circle cx="180" cy="310" r="10" fill="#00f5d4" />
  <circle cx="180" cy="310" r="4" fill="#05070f" />
  <circle cx="400" cy="140" r="9" fill="#3a86ff" />
  <circle cx="400" cy="140" r="4" fill="#ffffff" />
  <circle cx="620" cy="290" r="10" fill="#7b2cbf" />
  <circle cx="620" cy="290" r="4" fill="#ffffff" />

  <!-- Floating UI Glass Card -->
  <rect x="230" y="60" width="340" height="90" rx="16" fill="#0b0f19" fill-opacity="0.9" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="400" y="100" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">GlobeTrotter AI</text>
  <text x="400" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#00f5d4" text-anchor="middle">Multi-City AI Travel Engine • Odoo Hackathon 2026</text>

  <!-- Bottom Pills -->
  <rect x="140" y="360" width="140" height="34" rx="8" fill="#111726" stroke="#00f5d4" stroke-opacity="0.5" />
  <text x="210" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" text-anchor="middle">GPS Route Maps</text>

  <rect x="330" y="360" width="140" height="34" rx="8" fill="#111726" stroke="#3a86ff" stroke-opacity="0.5" />
  <text x="400" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" text-anchor="middle">Budget & Currency</text>

  <rect x="520" y="360" width="140" height="34" rx="8" fill="#111726" stroke="#7b2cbf" stroke-opacity="0.5" />
  <text x="590" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" text-anchor="middle">Collaborative Trips</text>
</svg>
