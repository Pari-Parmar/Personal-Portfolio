<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14" />
      <stop offset="50%" stop-color="#0a2e20" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)" />

  <!-- Smart Bin Schematic Illustration -->
  <g transform="translate(250, 150)">
    <!-- Rotating Waste Bin Drum -->
    <circle cx="150" cy="110" r="85" fill="#0f3d2a" stroke="#10b981" stroke-width="2" />
    <!-- 4 Compartments -->
    <line x1="150" y1="25" x2="150" y2="195" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="65" y1="110" x2="235" y2="110" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="150" cy="110" r="20" fill="#10b981" />

    <!-- Camera Eye at top -->
    <rect x="130" y="-30" width="40" height="28" rx="6" fill="#051c14" stroke="#34d399" stroke-width="1.5" />
    <circle cx="150" cy="-16" r="6" fill="#34d399" />
    <!-- Vision cone beams -->
    <path d="M 130,-2 L 70,50 L 230,50 Z" fill="#10b981" fill-opacity="0.1" stroke="#34d399" stroke-dasharray="3,3" stroke-width="1" />
  </g>

  <!-- Title Pill -->
  <rect x="230" y="35" width="340" height="80" rx="16" fill="#0a2e20" fill-opacity="0.9" stroke="rgba(52,211,153,0.3)" stroke-width="1" />
  <text x="400" y="70" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">GreenSort IoT</text>
  <text x="400" y="95" font-family="system-ui, sans-serif" font-size="13" fill="#34d399" text-anchor="middle">Smart Computer Vision Waste Segregation Bin</text>

  <!-- Tags -->
  <rect x="130" y="375" width="160" height="34" rx="8" fill="#0a2e20" stroke="#10b981" stroke-opacity="0.5" />
  <text x="210" y="397" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f3f4f6" text-anchor="middle">OpenCV Computer Vision</text>

  <rect x="320" y="375" width="160" height="34" rx="8" fill="#0a2e20" stroke="#34d399" stroke-opacity="0.5" />
  <text x="400" y="397" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f3f4f6" text-anchor="middle">IoT Stepper Actuation</text>

  <rect x="510" y="375" width="160" height="34" rx="8" fill="#0a2e20" stroke="#10b981" stroke-opacity="0.5" />
  <text x="590" y="397" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f3f4f6" text-anchor="middle">Automated Waste Sorting</text>
</svg>
